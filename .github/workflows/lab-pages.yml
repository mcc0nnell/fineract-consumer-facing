name: Synthetic fund lab

on:
  pull_request:
    paths:
      - 'lab/**'
      - '.github/workflows/lab-pages.yml'
  push:
    branches: [main]
    paths:
      - 'lab/**'
      - '.github/workflows/lab-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify deterministic fixture
        run: node lab/verify-data.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./lab

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
